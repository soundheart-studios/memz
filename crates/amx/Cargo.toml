[package]
name = "amx"
description = "AMX (Agent Memory eXchange): records, bundles and import planning for portable agent memory"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
ed25519-dalek = { version = "=2.1.1", optional = true, default-features = false, features = ["std", "zeroize"] }

[features]
default = []
# Ed25519 bundle signatures (manifest.sig).
signing = ["dep:ed25519-dalek"]
