name: Release

# Push a tag matching the workspace version (e.g. v0.1.0) to cut a release:
# full CI gate -> version check -> four target builds with smoke tests ->
# published GitHub release with archives and checksums.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  version:
    name: tag matches Cargo version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag with workspace version
        run: |
          VERSION=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -1)
          [ "$TAG" = "v$VERSION" ] || { echo "::error::tag $TAG does not match Cargo.toml version $VERSION"; exit 1; }

  build:
    name: build (${{ matrix.target }})
    needs: [ci, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, smoke: native }
          - { target: x86_64-apple-darwin, os: macos-latest, smoke: rosetta }
          # Ubuntu 22.04 runners link against glibc 2.35 for wider compatibility.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, smoke: native }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, smoke: native }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p memz --target ${{ matrix.target }}
      - name: Smoke test
        run: |
          BIN=target/${{ matrix.target }}/release/memz
          if [ "${{ matrix.smoke }}" = native ] || arch -x86_64 /usr/bin/true 2>/dev/null; then
            .github/scripts/smoke.sh "$BIN"
          else
            echo "Rosetta unavailable on this runner; built only"
          fi
      - name: Package
        run: |
          NAME=memz-${TAG}-${{ matrix.target }}
          mkdir -p "dist/$NAME"
          cp target/${{ matrix.target }}/release/memz README.md LICENSE-MIT LICENSE-APACHE "dist/$NAME/"
          cp -R .claude/skills/memz "dist/$NAME/skill"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: memz-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify checksums and combine
        working-directory: dist
        run: |
          shasum -a 256 -c ./*.sha256
          cat ./*.tar.gz.sha256 > SHA256SUMS
          rm ./*.tar.gz.sha256
          ls -l
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Memz $TAG" --generate-notes
